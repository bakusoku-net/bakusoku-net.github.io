<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爆速ページ - 通信とIPアドレス確認</title>
  <meta name="description" content="爆速ページは、インターネットの通信確認とIPv4・IPv6アドレスのチェックが0.001秒でできる日本最軽量クラスのテストサイトです。">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      font-size: 1.5rem;
      line-height: 1.8;
    }
    .box {
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="box">
    通信出来ました<br>
    IPv4:<span id="v4">確認中...</span><br>
    IPv6:<span id="v6">確認中...</span>
  </div>

  <script>
    fetch('https://my-ip.io')
      .then(r => r.json())
      .then(d => document.getElementById('v4').textContent = d.ip)
      .catch(() => {
        fetch('https://ipify.org')
          .then(r => r.json())
          .then(d => document.getElementById('v4').textContent = d.ip)
          .catch(() => document.getElementById('v4').textContent = '非対応 / 取得不可');
      });

    fetch('https://my-ip.io')
      .then(r => r.json())
      .then(d => document.getElementById('v6').textContent = d.ip)
      .catch(() => {
        fetch('https://ipify.org')
          .then(r => r.json())
          .then(d => document.getElementById('v6').textContent = d.ip)
          .catch(() => document.getElementById('v6').textContent = '非対応 / 取得不可');
      });
  </script>
</body>
</html>
