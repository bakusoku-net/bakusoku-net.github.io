<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆速ページ - 通信とIPアドレス確認</title>
</head>
<body style="text-align:center">
<h3>爆速ページ - 通信とIPアドレス確認</h3>
<p>通信出来ました</p>
<p>IPv4: <span id="v4">確認中...</span></p>
<p>IPv6: <span id="v6">確認中...</span></p>
<p id="msg"></p>

<script>
Promise.all([
  fetch('https://ipify.org').then(r => r.text()).catch(() => ''),
  fetch('https://ipify.org').then(r => r.text()).catch(() => '')
]).then(([res4, res6]) => {
  const ipv4 = res4.includes('.') ? res4.trim() : '';
  const ipv6 = res6.includes(':') ? res6.trim() : '';

  document.getElementById('v4').textContent = ipv4 || '未対応';
  document.getElementById('v6').textContent = ipv6 || '未対応';

  if (ipv4 && ipv6) {
    document.getElementById('msg').textContent = 'V6プラス（デュアルスタック / IPv4 over IPv6）で通信中！';
  }
});
</script>
</body>
</html>
