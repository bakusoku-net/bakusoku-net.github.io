<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆速ページ - 通信とIPアドレス確認</title>
</head>
<body style="text-align:center">
<h3>爆速ページ - 通信とIPアドレス確認</h3>
<p>通信出来ました</p>
<p>IPv4: <span id="v4">取得中...</span></p>
<p>IPv6: <span id="v6">取得中...</span></p>
<p id="msg"></p>

<script>
async function fetchRetry(url, checkChar) {
  for (let i = 0; i < 3; i++) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      const text = (await res.text()).trim();
      if (text.includes(checkChar)) return text;
    } catch (e) {}
  }
  return '';
}

Promise.all([
  fetchRetry('https://api.ipify.org', '.'),
  fetchRetry('https://ident.me', ':')
]).then(([ipv4, ipv6]) => {
  document.getElementById('v4').textContent = ipv4 || '未対応';
  document.getElementById('v6').textContent = ipv6 || '未対応';

  if (ipv4 && ipv6) {
    document.getElementById('msg').textContent = 'V6プラス（IPv4 over IPv6）をお使いです';
  }
});
</script>
</body>
</html>
