<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>爆速ページ - 通信とIPアドレス確認</title>
</head>
<body>
<h1>爆速ページ - 通信とIPアドレス確認</h1>
<p>通信出来ました</p>
<p>IPv4: <span id="v4">確認中...</span></p>
<p>IPv6: <span id="v6">確認中...</span></p>

<script>
fetch('https://ipify.org')
  .then(r => r.json())
  .then(d => document.getElementById('v4').textContent = d.ip)
  .catch(() => document.getElementById('v4').textContent = '未対応または取得失敗');

fetch('https://ipify.org')
  .then(r => r.json())
  .then(d => document.getElementById('v6').textContent = d.ip)
  .catch(() => document.getElementById('v6').textContent = '未対応（IPv4のみ）');
</script>
</body>
</html>
