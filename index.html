<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆速ページ - 通信とIPアドレス確認</title>
</head>
<body style="text-align:center">
<h3>爆速ページ - 通信とIPアドレス確認</h3>
<p>通信出来ました</p>
<p>IPv4: <span id="v4">確認中...</span></p>
<p>IPv6: <span id="v6">確認中...</span></p>

<script>
fetch('https://icanhazip.com')
  .then(r => r.text())
  .then(t => document.getElementById('v4').textContent = t.trim())
  .catch(() => document.getElementById('v4').textContent = '取得失敗');

fetch('https://icanhazip.com')
  .then(r => r.text())
  .then(t => document.getElementById('v6').textContent = t.trim())
  .catch(() => document.getElementById('v6').textContent = '未対応（IPv4のみ）');
</script>
</body>
</html>
